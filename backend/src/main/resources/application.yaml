spring:
  application:
    name: fkmovies
  modulith:
    # Only @ApplicationModule-annotated packages are modules (com.fksoft.application.<module>);
    # infra/shared are arrangement code governed by ArchUnit. See ModularityTests.
    detection-strategy: explicitly-annotated
  messages:
    # Fall back to the en bundle (messages.properties), never the server's locale, so an
    # English user never receives Portuguese emails (SPEC-0006 locale resolution).
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

# Required variables default to empty so a missing one fails Bean Validation at startup.
# The Boot binder ignores unresolvable ${VAR} placeholders (binds the literal), so a bare
# ${JWT_SECRET} would silently pass @NotBlank — the ":" empty default is the fail-fast.
app:
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl: ${JWT_ACCESS_TTL:}
    refresh-ttl: ${JWT_REFRESH_TTL:}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:0}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    to-override: ${MAIL_TO_OVERRIDE:}
  payment:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}
    # Backend's own base URL for the mock gateway's self-delivered webhook (single instance,
    # ADR 0002). In tests the live random port is used instead (spec 0015).
    webhook-base-url: ${PAYMENT_WEBHOOK_BASE_URL:http://localhost:8080}
    mock:
      delay: ${PAYMENT_MOCK_DELAY:PT3S}
      poll-interval: ${PAYMENT_MOCK_POLL_INTERVAL:PT1S}
      # Deterministic failure hooks (amount ending in 13) — keep off in prod.
      failure-rules-enabled: ${PAYMENT_MOCK_FAILURE_RULES:true}
  notification:
    # Public base URL used to build verification/reset links in emails.
    base-url: ${APP_BASE_URL:http://localhost:4200}
    poll-interval: PT30S
    batch-size: 20
  screening:
    # Cleaning/exit buffer (minutes) added after the movie duration when computing a
    # screening's end time and checking room overlap (spec 0009).
    buffer-minutes: ${SCREENING_BUFFER_MINUTES:30}
  booking:
    # Seat reservation tunables (spec 0014): max seats per reservation, hold (PENDING) duration,
    # and the minimum lead time before start during which new reservations are refused.
    max-seats-per-reservation: ${BOOKING_MAX_SEATS:8}
    hold-minutes: ${BOOKING_HOLD_MINUTES:5}
    min-lead-minutes: ${BOOKING_MIN_LEAD_MINUTES:10}
    # Window to pay after confirming (AWAITING_PAYMENT) before the deadline passes (spec 0016).
    payment-deadline-minutes: ${BOOKING_PAYMENT_DEADLINE_MINUTES:10}
  bootstrap:
    # First-admin seed (spec 0005): used once at startup if no admin exists, then ignored.
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    distribution:
      # Emit latency histogram buckets for HTTP requests so Grafana can compute per-route
      # percentiles (p95/p99) via histogram_quantile (SPEC-0026 observability dashboards).
      percentiles-histogram:
        http.server.requests: true
      # Bound the bucket range to keep cardinality sane — API calls are well under 2s.
      maximum-expected-value:
        http.server.requests: 2s
