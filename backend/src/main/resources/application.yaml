spring:
  application:
    name: fkmovies
  modulith:
    # Only @ApplicationModule-annotated packages are modules (com.fksoft.application.<module>);
    # infra/shared are arrangement code governed by ArchUnit. See ModularityTests.
    detection-strategy: explicitly-annotated
  messages:
    # Fall back to the en bundle (messages.properties), never the server's locale, so an
    # English user never receives Portuguese emails (SPEC-0006 locale resolution).
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

# Required variables default to empty so a missing one fails Bean Validation at startup.
# The Boot binder ignores unresolvable ${VAR} placeholders (binds the literal), so a bare
# ${JWT_SECRET} would silently pass @NotBlank — the ":" empty default is the fail-fast.
app:
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl: ${JWT_ACCESS_TTL:}
    refresh-ttl: ${JWT_REFRESH_TTL:}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:0}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    to-override: ${MAIL_TO_OVERRIDE:}
  payment:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}
  notification:
    # Public base URL used to build verification/reset links in emails.
    base-url: ${APP_BASE_URL:http://localhost:4200}
    poll-interval: PT30S
    batch-size: 20

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
