# Test profile: keeps the main application.yaml env-var placeholders out of the way.
# The real database connection comes from the Postgres Testcontainer via @ServiceConnection,
# which supersedes spring.datasource.* values.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/overridden-by-testcontainers
    username: overridden-by-testcontainers
    password: overridden-by-testcontainers

app:
  jwt:
    secret: test-secret-0123456789-0123456789-0123456789
    access-ttl: 15m
    refresh-ttl: 7d
  mail:
    host: localhost
    # GreenMail default SMTP port; only EmailDeliveryGreenMailTest actually starts a server.
    port: 3025
    username: ""
    password: ""
    from: noreply@fkmovies.local
    to-override: ""
  payment:
    webhook-secret: test-webhook-secret
    mock:
      # Tests drive MockPaymentDispatcher.deliverDue() explicitly (deterministic, no scheduler race
      # with cleanup); a long interval keeps the @Scheduled poll dormant. Zero delay = due immediately.
      delay: PT0S
      poll-interval: PT1H
      failure-rules-enabled: true
  booking:
    payment-deadline-minutes: 10
    # The expiration sweep is driven explicitly in tests (deterministic, no scheduler race); a long
    # interval keeps the @Scheduled poll dormant. Tests call ReservationExpirationDispatcher.sweep().
    expiration-interval: PT1H
  notification:
    base-url: http://localhost:4200
    poll-interval: PT30S
    batch-size: 20
    # Tests drive OutboxSendWorker directly; the scheduled dispatcher stays off.
    dispatch-enabled: false
