<main class="mx-auto flex max-w-3xl flex-col gap-6 p-8">
  <p-card [header]="'home.welcome' | translate">
    <p class="text-base">{{ 'home.subtitle' | translate }}</p>
    <div class="mt-4 flex items-center gap-3">
      <p-button [label]="'home.cta' | translate" icon="pi pi-ticket" routerLink="/sessoes" />

    </div>
  </p-card>
</main>
